[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "causekit"
version = "0.7.0a6"
description = "Identification-aware causal inference and instrumental-variable workflows for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oluwajuwon Mayomi Akanbi" }]
maintainers = [{ name = "Oluwajuwon Mayomi Akanbi" }]
keywords = [
  "causal inference",
  "causal machine learning",
  "double machine learning",
  "econometrics",
  "instrumental variables",
  "randomized experiments",
  "inverse probability weighting",
  "difference-in-differences",
  "event studies",
  "2sls",
  "treatment effects",
  "identification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.23,<3",
  "pandas>=1.5,<4",
  "scipy>=1.9,<2",
]

[project.optional-dependencies]
outputhub = ["universal-output-hub>=0.2.2,<1"]
plot = ["matplotlib>=3.7,<4"]
security = ["pip-audit>=2.7,<3"]
validation = [
  "linearmodels>=5,<8",
  "statsmodels>=0.14,<1",
]
test = [
  "linearmodels>=5,<8",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "statsmodels>=0.14,<1",
  "universal-output-hub>=0.2.2,<1",
]
dev = [
  "build>=1.2,<2",
  "linearmodels>=5,<8",
  "mypy>=1.10,<2",
  # NumPy 2.5 stubs use Python 3.12 syntax; mypy targets CauseKit's Python 3.10 floor.
  "numpy<2.5",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "statsmodels>=0.14,<1",
  "twine>=5,<7",
  "universal-output-hub>=0.2.2,<1",
]

[project.urls]
Homepage = "https://github.com/Akanom/causekit"
Repository = "https://github.com/Akanom/causekit"
Issues = "https://github.com/Akanom/causekit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "validation: numerical comparison against an independent implementation",
  "simulation: deterministic simulation or Monte Carlo recovery validation",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "pandas",
  "pandas.*",
  "scipy",
  "scipy.*",
  "universal_output_hub",
  "universal_output_hub.*",
]
ignore_missing_imports = true
